<html>

<head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6fb;
text-align:center;
}

nav{
background:#2f4a8a;
padding:15px;
}

nav a{

text-decoration:none;

}

input{

}

padding:10px 15px;
background:#3b6bd6;

}

}

height:300px;

<body>

<nav>

<a href="index.html">Home</a> <a href="about.html">About</a> <a href="founder.html">Founder</a> <a href="vote.html">How To Vote</a> <a href="contact.html">Contact</a>

</nav>

<h1>EagleReach Civic Intelligence Platform</h1>

<p>Know your government. Stay informed. Participate.</p>

<input id="zip" placeholder="Enter ZIP code">

<button onclick="searchZip()">Search</button>

<button onclick="useLocation()">Use My Location</button>

<div id="map"></div>

<div id="result"></div>

<div id="weather"></div>

<div id="news"></div>

<div id="countdown"></div>

<div id="emergency"></div>

<script>

const API="https://eaglereach-v2.onrender.com"

let map=L.map('map').setView([39.8283,-98.5795],4)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

let marker

async function searchZip(){

let zip=document.getElementById("zip").value

let response=await fetch(API+"/zip/"+zip)

let data=await response.json()

showRepresentatives(data)

updateMap(data.latitude,data.longitude)

loadWeather(data.latitude,data.longitude)

loadNews(data.city)

electionCountdown()

showEmergency()

}

function showRepresentatives(data){

let html="<div class='card'><h3>Your Representatives</h3>"

if(data.senators){

data.senators.forEach(name=>{

html+=`

<div class="rep">

<b>Senator:</b> ${name}

</div>

`

})

}

if(data.representatives){

data.representatives.forEach(name=>{

html+=`

<div class="rep">

<b>Representative:</b> ${name}

</div>

`

})

}

html+="</div>"

document.getElementById("result").innerHTML=html

}

function updateMap(lat,lon){

if(marker){
map.removeLayer(marker)
}

map.setView([lat,lon],10)

marker=L.marker([lat,lon]).addTo(map)

}

function useLocation(){

navigator.geolocation.getCurrentPosition(pos=>{

let lat=pos.coords.latitude
let lon=pos.coords.longitude

map.setView([lat,lon],10)

marker=L.marker([lat,lon]).addTo(map)

})

}

async function loadWeather(lat,lon){

let res=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
)

let data=await res.json()

document.getElementById("weather").innerHTML=

`<div class="card">

<h3>Weather</h3>

Temperature: ${data.current_weather.temperature}°C<br>
Wind Speed: ${data.current_weather.windspeed} km/h

</div>`

}

function loadNews(city){

document.getElementById("news").innerHTML=

`<div class="card news">

<h3>Local News</h3>

<img src="https://source.unsplash.com/400x200/?news">

<br><br>

<a target="_blank"
href="https://news.google.com/search?q=${city}">
View Latest News
</a>

</div>`

}

function electionCountdown(){

let electionDate=new Date("Nov 3, 2026").getTime()

let today=new Date().getTime()

let days=Math.floor((electionDate-today)/(1000*60*60*24))

document.getElementById("countdown").innerHTML=

`<div class="card">

<h3>Next US Federal Election</h3>

November 3, 2026<br><br>

${days} days remaining

</div>`

}

function showEmergency(){

document.getElementById("emergency").innerHTML=

`<div class="card">

<h3>Emergency Numbers</h3>

911 — Emergency<br>
988 — Mental Health Crisis<br>
211 — Community Services<br>
311 — City Services

</div>`

}

</script>

<footer>

EagleReach — Civic Intelligence Platform 🇺🇸

</footer>

</body>

</html>
