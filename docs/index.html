<!DOCTYPE html>
<html>

<head>

<title>EagleReach Civic Intelligence Platform</title>

<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#2e4c8c;
color:white;
padding:20px;
text-align:center;
}

.search-box{
text-align:center;
margin:20px;
}

input{
padding:10px;
width:220px;
}

button{
padding:10px 15px;
background:#3b6dd8;
color:white;
border:none;
cursor:pointer;
}

#map{
height:400px;
margin:20px;
}

.section{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.rep-card{
border-bottom:1px solid #eee;
padding:10px 0;
}

a{
color:#3b6dd8;
}

</style>

</head>

<body>

<header>

<h1>EagleReach Civic Intelligence Platform</h1>
<p>Know your government. Stay informed. Participate.</p>

</header>

<div class="search-box">

<input id="zipInput" placeholder="Enter ZIP code">

<button onclick="searchZip()">Search</button>

<button onclick="useMyLocation()">Use My Location</button>

</div>

<div id="map"></div>

<div class="section">

<h2>Your Representatives</h2>

<div id="representatives"></div>

</div>

<div class="section">

<h2>Weather</h2>

<div id="weather"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const OPENSTATES_API_KEY = "YOUR_OPENSTATES_API_KEY";
const OPENWEATHER_API_KEY = "YOUR_OPENWEATHER_API_KEY";

let map = L.map('map').setView([39.8283,-98.5795],4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OpenStreetMap'
}).addTo(map);

let marker;

async function searchZip(){

const zip=document.getElementById("zipInput").value;

const response=await fetch(`https://api.zippopotam.us/us/${zip}`);
const data=await response.json();

const lat=data.places[0].latitude;
const lng=data.places[0].longitude;
const city=data.places[0]["place name"];
const state=data.places[0]["state"];

updateMap(lat,lng);

loadRepresentatives(lat,lng);

loadWeather(lat,lng,city,state);

}

function useMyLocation(){

navigator.geolocation.getCurrentPosition(position=>{

const lat=position.coords.latitude;
const lng=position.coords.longitude;

updateMap(lat,lng);

loadRepresentatives(lat,lng);

loadWeather(lat,lng,"Your Location","");

});

}

function updateMap(lat,lng){

map.setView([lat,lng],11);

if(marker){
map.removeLayer(marker);
}

marker=L.marker([lat,lng]).addTo(map);

}

async function loadRepresentatives(lat,lng){

const response=await fetch(
`https://v3.openstates.org/people.geo?lat=${lat}&lng=${lng}`,
{
headers:{
"X-API-KEY":OPENSTATES_API_KEY
}
}
);

const data=await response.json();

displayReps(data.results);

}

function displayReps(reps){

const container=document.getElementById("representatives");

container.innerHTML="";

reps.forEach(rep=>{

let website="Not available";
let phone="Not available";

if(rep.links && rep.links.length>0){
website=rep.links[0].url;
}

if(rep.contact_details && rep.contact_details.length>0){
phone=rep.contact_details[0].value;
}

const card=document.createElement("div");

card.className="rep-card";

card.innerHTML=`

<h3>${rep.name}</h3>

<p><b>Party:</b> ${rep.party || ""}</p>

<p><b>District:</b> ${rep.current_role?.district || ""}</p>

<p><b>Phone:</b> ${phone}</p>

<p><b>Website:</b>
<a href="${website}" target="_blank">${website}</a>
</p>

`;

container.appendChild(card);

});

}

async function loadWeather(lat,lon,city,state){

const response=await fetch(
`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${OPENWEATHER_API_KEY}`
);

const data=await response.json();

document.getElementById("weather").innerHTML=`

<h3>${city} ${state}</h3>

<p>Temperature: ${data.main.temp} °F</p>

<p>Weather: ${data.weather[0].description}</p>

<p>Humidity: ${data.main.humidity}%</p>

`;

}

</script>

</body>

</html>
