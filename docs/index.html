<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>EagleReach Civic Intelligence Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
text-align:center;
}

nav{
background:#35559c;
padding:14px;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.container{
width:80%;
margin:auto;
padding:20px;
}

input{
padding:10px;
width:220px;
}

button{
padding:10px;
background:#3f66d3;
color:white;
border:none;
cursor:pointer;
margin-left:5px;
}

.card{
background:white;
padding:20px;
margin-top:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#map{
height:350px;
margin-top:20px;
}

.rep{
margin-top:15px;
padding:10px;
border-bottom:1px solid #ddd;
}

.rep a{
color:#35559c;
text-decoration:none;
}

@media(max-width:768px){

.container{
width:95%;
}

input{
width:100%;
margin-bottom:10px;
}

button{
width:100%;
margin-top:5px;
}

}

</style>

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="founder.html">Founder</a>
<a href="vote.html">How To Vote</a>
<a href="contact.html">Contact</a>

</nav>

<div class="container">

<h1>EagleReach Civic Intelligence Platform</h1>

<p>Know your government. Stay informed. Participate.</p>

<input id="zip" placeholder="Enter ZIP Code">

<button onclick="searchZip()">Search</button>

<button onclick="useLocation()">Use My Location</button>

<div id="map"></div>

<div id="result" class="card"></div>

<div id="weather" class="card"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API="https://eaglereach-v2.onrender.com"

let map=L.map('map').setView([39,-84],8)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map)

async function searchZip(){

const zip=document.getElementById("zip").value

if(!zip){
alert("Enter ZIP Code")
return
}

loadZip(zip)

}

async function useLocation(){

navigator.geolocation.getCurrentPosition(async position=>{

let lat=position.coords.latitude
let lon=position.coords.longitude

map.setView([lat,lon],11)

L.marker([lat,lon]).addTo(map)

loadWeather(lat,lon)

})

}

async function loadZip(zip){

try{

const res=await fetch(`${API}/zip/${zip}`)
const data=await res.json()

render(data)

}catch{

alert("API request failed")

}

}

function render(data){

const lat=data.latitude
const lon=data.longitude

map.setView([lat,lon],11)

L.marker([lat,lon]).addTo(map)

let reps=""

data.senators.forEach(s=>{

reps+=`
<div class="rep">
<b>Senator:</b> ${s.name}<br>
Party: ${s.party}<br>
Phone: ${s.phone}<br>
<a href="${s.website}" target="_blank">Official Website</a>
</div>
`

})

data.representatives.forEach(r=>{

reps+=`
<div class="rep">
<b>Representative:</b> ${r.name}<br>
Party: ${r.party}<br>
Phone: ${r.phone}<br>
<a href="${r.website}" target="_blank">Official Website</a>
</div>
`

})

document.getElementById("result").innerHTML=`

<h2>${data.city}, ${data.state}</h2>

<p><b>ZIP Code:</b> ${data.zip}</p>

<h3>Your Representatives</h3>

${reps}

`

loadWeather(lat,lon)

}

async function loadWeather(lat,lon){

const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
const data=await w.json()

const temp=data.current_weather.temperature
const wind=data.current_weather.windspeed
const code=data.current_weather.weathercode

let icon="☀️"
let cond="Clear"

if(code>=1 && code<=2){icon="⛅";cond="Partly Cloudy"}
else if(code==3){icon="☁️";cond="Cloudy"}
else if(code>=51 && code<=67){icon="🌧";cond="Rain"}
else if(code>=71 && code<=77){icon="❄️";cond="Snow"}
else if(code>=95){icon="⛈";cond="Storm"}

document.getElementById("weather").innerHTML=`

<h3>Weather</h3>

<h1>${icon}</h1>

<p>${cond}</p>

<p>Temperature: ${temp}°C</p>

<p>Wind Speed: ${wind} km/h</p>

`

}

</script>

</body>

</html>
