<!DOCTYPE html>
<html>
<head>
    <title>🇺🇸 EagleReach</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔵 NAVBAR -->
<div class="navbar">
    <div>🇺🇸 EagleReach</div>
    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="founder.html">Founder</a>
        <a href="vote.html">How to Vote</a>
        <a href="contact.html">Contact</a>
    </div>

<!-- 🏠 MAIN CONTAINER -->
<div class="container">

    <h2>Know Your Community. Take Action.</h2>

    <!-- 🔍 SEARCH -->
    <div class="search-box">
        <input id="zip" placeholder="Enter ZIP code">
        <button onclick="searchZip()">Search</button>
        <button onclick="useLocation()">Use My Location</button>
    </div>

    <!-- 📍 LOCATION -->
    <div id="location"></div>

    <!-- 🏛 REPRESENTATIVES -->
    <h3>🏛 Representatives</h3>
    <div id="leaders"></div>

    <!-- 🌤 WEATHER -->
    <h3>🌤 Weather (7 Days)</h3>
    <div id="weather"></div>

    <!-- 📰 LOCAL NEWS -->
    <h3>📰 Local News (Google News)</h3>
    <div id="local"></div>

    <!-- 🌍 WORLD NEWS -->
    <h3>🌍 World News (Google News)</h3>
    <div id="world"></div>

    <!-- 🚨 EMERGENCY -->
    <h3>🚨 Emergency Services</h3>
    <div class="card">
        <p>📞 Police / Fire: 911</p>
        <p>🚑 Medical: 911</p>
        <p>☠ Poison Control: 1-800-222-1222</p>
        <p>🧠 Mental Health: 988</p>
    </div>

</div>

<!-- ⚙️ JS -->
<script src="app.js"></script>
