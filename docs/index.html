<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>EagleReach Civic Intelligence</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
text-align:center;
}

nav{
background:#35559c;
padding:15px;
color:white;
font-size:20px;
}

.container{
width:90%;
margin:auto;
padding:20px;
}

input{
padding:10px;
width:200px;
}

button{
padding:10px;
background:#3f66d3;
color:white;
border:none;
cursor:pointer;
}

.card{
background:white;
padding:20px;
margin-top:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#map{
height:350px;
margin-top:20px;
}

@media(max-width:768px){
input{
width:100%;
}
}

</style>

</head>

<body>

<nav>EagleReach Civic Intelligence Platform</nav>

<div class="container">

<h2>Know your government. Stay informed.</h2>

<input id="zip" placeholder="Enter ZIP">

<button onclick="searchZip()">Search</button>

<div id="map"></div>

<div id="location" class="card"></div>

<div id="representatives" class="card"></div>

<div id="senators" class="card"></div>

<div id="news" class="card"></div>

<div id="weather" class="card"></div>

<div id="time" class="card"></div>

<div id="emergency" class="card"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API="https://eaglereach-v2.onrender.com"

let map=L.map('map').setView([39,-84],5)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)

async function searchZip(){

try{

const zip=document.getElementById("zip").value

const res=await fetch(`${API}/zip/${zip}`)

const data=await res.json()

document.getElementById("location").innerHTML=
`<h3>${data.city}, ${data.state}</h3>`

map.setView([data.latitude,data.longitude],10)

L.marker([data.latitude,data.longitude]).addTo(map)

loadWeather(data.latitude,data.longitude)
loadNews(data.city)
loadReps()
loadSenators()
loadTime()
loadEmergency()

}catch(e){

alert("API request failed")

}

}

async function loadReps(){

const r=await fetch(`${API}/representatives`)
const data=await r.json()

let html="<h3>Representatives</h3>"

data.forEach(p=>{
html+=`
<p>
${p.name}<br>
Party: ${p.party}<br>
<a href="${p.website}" target="_blank">Official Website</a>
</p>`
})

document.getElementById("representatives").innerHTML=html
}

async function loadSenators(){

const r=await fetch(`${API}/senators`)
const data=await r.json()

let html="<h3>Senators</h3>"

data.forEach(p=>{
html+=`
<p>
${p.name}<br>
Party: ${p.party}<br>
<a href="${p.website}" target="_blank">Official Website</a>
</p>`
})

document.getElementById("senators").innerHTML=html
}

async function loadNews(city){

const r=await fetch(`${API}/news/local/${city}`)
const data=await r.json()

let html="<h3>Local News</h3>"

data.forEach(n=>{
html+=`<p><a href="${n.url}" target="_blank">${n.title}</a></p>`
})

document.getElementById("news").innerHTML=html
}

async function loadWeather(lat,lon){

const r=await fetch(`${API}/weather/${lat}/${lon}`)
const data=await r.json()

let html="<h3>7 Day Weather</h3>"

data.forEach(d=>{
html+=`<p>${d.date}: ${d.max_temp}°C</p>`
})

document.getElementById("weather").innerHTML=html
}

async function loadTime(){

const r=await fetch(`${API}/time`)
const data=await r.json()

document.getElementById("time").innerHTML=
`<h3>Current Time</h3>${data.time}`

}

async function loadEmergency(){

const r=await fetch(`${API}/emergency`)
const data=await r.json()

let html="<h3>Emergency Numbers</h3>"

for(let k in data){
html+=`<p>${k}: ${data[k]}</p>`
}

document.getElementById("emergency").innerHTML=html

}

</script>

</body>
</html>
