<!DOCTYPE html>

<html>

<head>

<title>EagleReach Civic Information Platform</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#eef1f7;
}

.navbar{
background:#2f4a92;
padding:15px;
text-align:center;
}

.navbar a{
color:white;
margin:0 20px;
text-decoration:none;
font-weight:bold;
}

.container{
text-align:center;
margin-top:60px;
}

input{
padding:10px;
width:220px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:10px 15px;
background:#3b6ce1;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin-left:5px;
}

.card{
margin-top:25px;
display:inline-block;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0px 3px 12px rgba(0,0,0,0.15);
width:360px;
}

.footer{
margin-top:80px;
color:#777;
font-size:13px;
text-align:center;
}

</style>

</head>

<body>

<div class="navbar">

<a href="index.html">Home</a> <a href="about.html">About</a> <a href="founder.html">Founder</a> <a href="vote.html">How To Vote</a> <a href="contact.html">Contact</a>

</div>

<div class="container">

<h2>EagleReach Civic Information Platform</h2>

<p>Search by ZIP code or use your location.</p>

<input id="zip" placeholder="Enter ZIP code">

<button type="button" id="searchBtn">Search</button>

<button type="button" id="locationBtn">Use My Location</button>

<div id="result"></div>

</div>

<script>

const API = "https://eaglereach-v2.onrender.com"


document.getElementById("searchBtn").addEventListener("click", searchZip)
document.getElementById("locationBtn").addEventListener("click", useLocation)



async function searchZip(){

let zip = document.getElementById("zip").value

if(zip.length != 5){
alert("Enter a valid ZIP code")
return
}

try{

let response = await fetch(API + "/zip/" + zip)

let data = await response.json()

display(data)

}catch(err){

alert("API request failed")

}

}



function useLocation(){

if(!navigator.geolocation){

alert("Geolocation not supported")

return

}

navigator.geolocation.getCurrentPosition(async function(position){

try{

let lat = position.coords.latitude
let lon = position.coords.longitude

let geo = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)

let geoData = await geo.json()

let zip = geoData.postcode

if(!zip){

alert("ZIP code not detected")

return

}

document.getElementById("zip").value = zip

searchZip()

}catch(e){

alert("Location lookup failed")

}

})

}



function display(data){

if(data.error){

document.getElementById("result").innerHTML =
`
<div class="card">
Error: ${data.error}
</div>
`
return
}

let time = new Date().toLocaleString()

document.getElementById("result").innerHTML =

`
<div class="card">

<h3>${data.city}, ${data.state}</h3>

ZIP: ${data.zip}<br><br>

Latitude: ${data.latitude}<br>
Longitude: ${data.longitude}<br><br>

<b>US Senators</b><br>
${data.senators.join("<br>")}<br><br>

<b>House Representative</b><br>
${data.representatives.join("<br>")}<br><br>

<b>Current Time</b><br>
${time}<br><br>

<b>Voting Information</b><br>
<a href="https://vote.gov" target="_blank">Go to Vote.gov</a>

</div>
`

}

</script>

<div class="footer">

Open-source civic information platform — EagleReach

</div>

</body>
</html>
