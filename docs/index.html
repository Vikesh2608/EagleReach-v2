<!DOCTYPE html>

<html>

<head>

<title>EagleReach Civic Information Platform</title>

<style>

body{
font-family:Arial;
background:#eef1f7;
text-align:center;
margin:0;
}

.navbar{
background:#2f4a92;
padding:15px;
}

.navbar a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

.container{
margin-top:60px;
}

input{
padding:10px;
width:220px;
border-radius:5px;
border:1px solid #ccc;
}

button{
padding:10px 15px;
background:#3b6ce1;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
margin-left:5px;
}

.card{
margin-top:25px;
display:inline-block;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0px 3px 10px rgba(0,0,0,0.15);
width:350px;
}

</style>

</head>

<body>

<div class="navbar">

<a href="index.html">Home</a> <a href="about.html">About</a> <a href="founder.html">Founder</a> <a href="vote.html">How To Vote</a> <a href="contact.html">Contact</a>

</div>

<div class="container">

<h2>EagleReach Civic Information Platform</h2>

<p>Search by ZIP code</p>

<input id="zip" placeholder="Enter ZIP code">

<button onclick="searchZip()">Search</button>

<button onclick="useLocation()">Use My Location</button>

<div id="result"></div>

</div>

<script>

const API="https://eaglereach-v2.onrender.com"

async function searchZip(){

let zip=document.getElementById("zip").value

if(zip.length!=5){
alert("Enter valid ZIP code")
return
}

try{

let response=await fetch(API+"/zip/"+zip)

let data=await response.json()

show(data)

}catch(e){

alert("Backend connection failed")

}

}



function show(data){

let time=new Date().toLocaleString()

document.getElementById("result").innerHTML=

`
<div class="card">

<h3>${data.city}, ${data.state}</h3>

ZIP: ${data.zip}<br><br>

Latitude: ${data.latitude}<br>
Longitude: ${data.longitude}<br><br>

<b>US Senators</b><br>
${data.senators.join("<br>")}<br><br>

<b>House Representative</b><br>
${data.representatives.join("<br>")}<br><br>

<b>Current Time</b><br>
${time}<br><br>

<a href="https://vote.gov" target="_blank">Voting Information</a>

</div>
`

}



function useLocation(){

navigator.geolocation.getCurrentPosition(async function(pos){

let lat=pos.coords.latitude
let lon=pos.coords.longitude

let geo=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)

let g=await geo.json()

if(!g.postcode){
alert("ZIP not detected")
return
}

document.getElementById("zip").value=g.postcode

searchZip()

})

}

</script>

</body>
</html>
