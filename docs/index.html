<!DOCTYPE html>
<html>
<head>
    <title>🇺🇸 EagleReach</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <div>🇺🇸 EagleReach</div>
    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="founder.html">Founder</a>
        <a href="vote.html">How to Vote</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<div class="main-layout">

    <!-- LEFT -->
    <div class="content">

        <h2>Know Your Community. Take Action.</h2>

        <input id="zip" placeholder="Enter ZIP code">
        <button onclick="searchZip()">Search</button>
        <button onclick="useLocation()">Use My Location</button>

        <div id="location"></div>

        <h3>🏛 Representatives</h3>
        <div id="leaders"></div>

        <h3>🌤 Weather (7 Days)</h3>
        <div id="weather"></div>

        <h3>
            <img src="https://www.gstatic.com/images/branding/product/1x/googleg_32dp.png" width="18">
            Local News
        </h3>
        <div id="local"></div>

        <h3>🌍 World News</h3>
        <div id="world"></div>

    </div>

    <!-- RIGHT -->
    <div class="sidebar">

        <h3>🚨 Emergency</h3>

        <div class="card">🚔 Police / Fire: <b>911</b></div>
        <div class="card">🚑 Medical: <b>911</b></div>
        <div class="card">☠️ Poison Control: <b>1-800-222-1222</b></div>
        <div class="card">🧠 Mental Health: <b>988</b></div>

        <h3>🗳 Voting</h3>

        <div class="card">
            <a href="https://www.usa.gov/register-to-vote" target="_blank">Register to Vote</a>
        </div>

        <div class="card">
            <a href="https://www.usa.gov/voting" target="_blank">How to Vote</a>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
