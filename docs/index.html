<!DOCTYPE html>

<html>

<head>

<title>EagleReach Civic Intelligence Platform</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6fb;
text-align:center;
}

nav{
background:#2f4a8a;
padding:15px;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

.container{
margin-top:30px;
}

input{
padding:10px;
font-size:16px;
width:220px;
}

button{
padding:10px 16px;
background:#3b6bd6;
border:none;
color:white;
border-radius:4px;
cursor:pointer;
margin-left:5px;
}

button:hover{
background:#284ea8;
}

#map{
height:300px;
width:80%;
margin:20px auto;
border-radius:8px;
}

.rep-card{
background:white;
border-radius:10px;
padding:20px;
margin:15px auto;
width:420px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:left;
}

.rep-name{
font-size:20px;
font-weight:bold;
}

.rep-party{
color:#666;
margin-bottom:10px;
}

.rep-buttons a{
text-decoration:none;
padding:8px 14px;
margin-right:10px;
border-radius:6px;
background:#2f4a8a;
color:white;
font-size:14px;
}

.card{
background:white;
width:420px;
margin:20px auto;
padding:20px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.chatbox{
width:420px;
margin:20px auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<nav>

<a href="index.html">Home</a> <a href="about.html">About</a> <a href="founder.html">Founder</a> <a href="vote.html">How To Vote</a> <a href="contact.html">Contact</a>

</nav>

<div class="container">

<h1>EagleReach Civic Intelligence Platform</h1>

<p>Discover your government, stay informed, and participate in democracy.</p>

<input id="zip" placeholder="Enter ZIP code">

<button onclick="searchZip()">Search</button>

<button onclick="useLocation()">Use My Location</button>

<div id="map"></div>

<div id="result"></div>

<div id="weather"></div>

<div id="news"></div>

<div id="election"></div>

<div id="government"></div>

<div class="chatbox">

<h3>Ask EagleReach AI</h3>

<input id="question" placeholder="Ask a civic question">

<button onclick="askAI()">Ask</button>

<p id="aiResponse"></p>

</div>

</div>

<script>

const API="https://eaglereach-v2.onrender.com";

let map=L.map('map').setView([39.8283,-98.5795],4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

let marker;

async function searchZip(){

let zip=document.getElementById("zip").value;

if(!zip){
alert("Enter ZIP Code");
return;
}

try{

let response=await fetch(API+"/zip/"+zip);

let data=await response.json();

displayData(data);

updateMap(data.latitude,data.longitude);

loadWeather(data.latitude,data.longitude);

loadNews(data.city);

showElectionCountdown();

loadGovernment();

}catch{

alert("API request failed");

}

}

function displayData(data){

let html="<h2>Your Representatives</h2>";

data.senators.forEach(s=>{

html+=`
<div class="rep-card">

<div class="rep-name">${s}</div>

<div class="rep-party">US Senator</div>

<div class="rep-buttons">

<a href="https://www.senate.gov" target="_blank">Official Website</a>

</div>

</div>
`;

});

data.representatives.forEach(r=>{

html+=`
<div class="rep-card">

<div class="rep-name">${r}</div>

<div class="rep-party">US Representative</div>

<div class="rep-buttons">

<a href="https://www.house.gov" target="_blank">Official Website</a>

</div>

</div>
`;

});

document.getElementById("result").innerHTML=html;

}

function updateMap(lat,lon){

if(marker){
map.removeLayer(marker);
}

map.setView([lat,lon],10);

marker=L.marker([lat,lon]).addTo(map);

}

function useLocation(){

navigator.geolocation.getCurrentPosition(async function(position){

let lat=position.coords.latitude;
let lon=position.coords.longitude;

let geo=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);

let g=await geo.json();

document.getElementById("zip").value=g.postcode;

searchZip();

});

}

async function loadWeather(lat,lon){

let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);

let data=await res.json();

document.getElementById("weather").innerHTML=

`<div class="card">
<h3>Weather</h3>
Temperature: ${data.current_weather.temperature}°C<br>
Wind Speed: ${data.current_weather.windspeed} km/h
</div>`;

}

async function loadNews(city){

document.getElementById("news").innerHTML=

`<div class="card">

<h3>News</h3>

<ul>

<li><a target="_blank" href="https://news.google.com/search?q=${city}">Local News in ${city}</a></li>

<li><a target="_blank" href="https://www.reuters.com">Reuters World News</a></li>

<li><a target="_blank" href="https://www.bbc.com/news">BBC World News</a></li>

</ul>

</div>`;

}

function showElectionCountdown(){

let electionDate=new Date("Nov 5, 2026");

let now=new Date();

let diff=electionDate-now;

let days=Math.floor(diff/(1000*60*60*24));

document.getElementById("election").innerHTML=

`<div class="card">

<h3>Election Countdown</h3>

${days} days until the next US Federal Election

</div>`;

}

async function loadGovernment(){

document.getElementById("government").innerHTML=

`<div class="card">

<h3>Today in Your Government</h3>

<ul>

<li>Infrastructure funding bill debate</li>

<li>Defense budget discussion</li>

<li>Education reform proposal</li>

</ul>

</div>`;

}

function askAI(){

let q=document.getElementById("question").value.toLowerCase();

let answer="";

if(q.includes("senator")){
answer="Your US Senators are listed above.";
}

else if(q.includes("vote")){
answer="You can register to vote at vote.gov.";
}

else{
answer="Ask about voting, senators, representatives or elections.";
}

document.getElementById("aiResponse").innerText=answer;

}

</script>

</body>

</html>
