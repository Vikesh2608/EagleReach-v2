<!DOCTYPE html>
<html>
<head>

<title>EagleReach Civic Information Platform</title>

<style>

body{
font-family: Arial;
background:#f4f6fb;
margin:0;
text-align:center;
}

nav{
background:#2f4a8a;
padding:15px;
}

nav a{
color:white;
margin:0 20px;
text-decoration:none;
font-weight:bold;
}

.container{
margin-top:50px;
}

input{
padding:10px;
width:220px;
font-size:16px;
}

button{
padding:10px 15px;
font-size:16px;
background:#3c66d6;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
margin-left:5px;
}

button:hover{
background:#2a4cb3;
}

.card{
background:white;
width:420px;
margin:30px auto;
padding:25px;
border-radius:8px;
box-shadow:0px 4px 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="founder.html">Founder</a>
<a href="vote.html">How To Vote</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">

<h1>EagleReach Civic Information Platform</h1>
<p>Search by ZIP code or use your location.</p>

<input id="zip" placeholder="Enter ZIP code">

<button onclick="searchZip()">Search</button>

<button onclick="useLocation()">Use My Location</button>

<div id="result"></div>

</div>

<script>

const API="https://eaglereach-v2.onrender.com";

async function searchZip(){

let zip=document.getElementById("zip").value;

if(!zip){
alert("Enter ZIP Code");
return;
}

try{

let response=await fetch(API+"/zip/"+zip);

let data=await response.json();

showResult(data);

}catch(error){

alert("API request failed");

}

}

function showResult(data){

let time=new Date().toLocaleString();

let senators=data.senators.map(s=>"<li>"+s+"</li>").join("");

let reps=data.representatives.map(r=>"<li>"+r+"</li>").join("");

document.getElementById("result").innerHTML=`

<div class="card">

<h2>${data.city}, ${data.state}</h2>

<p><b>ZIP Code:</b> ${data.zip}</p>

<p><b>Current Time:</b> ${time}</p>

<h3>US Senators</h3>
<ul>${senators}</ul>

<h3>US Representative</h3>
<ul>${reps}</ul>

<h3>Voting Information</h3>
<a href="https://vote.gov" target="_blank">Go to Vote.gov</a>

<p style="margin-top:20px;">
Voting in elections is an important civic duty.
Stay informed and participate in your local and national elections.
</p>

</div>

`;

}

function useLocation(){

if(!navigator.geolocation){
alert("Geolocation not supported");
return;
}

navigator.geolocation.getCurrentPosition(async function(position){

let lat=position.coords.latitude;
let lon=position.coords.longitude;

try{

let geo=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);

let geoData=await geo.json();

let zip=geoData.postcode;

document.getElementById("zip").value=zip;

searchZip();

}catch{

alert("Location lookup failed");

}

});

}

</script>

</body>
</html>
