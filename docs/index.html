<!DOCTYPE html>
<html>
<head>
    <title>🇺🇸 EagleReach</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">🇺🇸 EagleReach</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="founder.html">Founder</a>
        <a href="vote.html">How to Vote</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <h1>Know Your Community.<br>Take Action.</h1>
    <p>Civic intelligence platform for citizens</p>

    <div class="search-box">
        <input id="zip" placeholder="Enter ZIP code">
        <button onclick="searchZip()">Search</button>
        <button class="secondary" onclick="useLocation()">Use My Location</button>
    </div>
</div>

<!-- MAIN -->
<div class="main-layout">

    <!-- LEFT -->
    <div class="content">

        <div id="location" class="card highlight"></div>

        <h2>🏛 Representatives</h2>
        <div id="leaders"></div>

        <h2>🌤 Weather</h2>
        <div id="weather"></div>

        <h2>📰 Local News</h2>
        <div id="local"></div>

        <h2>🌍 World News</h2>
        <div id="world"></div>

    </div>

    <!-- RIGHT -->
    <div class="sidebar">

        <div class="card emergency">
            <h3>🚨 Emergency</h3>
            <p>Police / Fire: <b>911</b></p>
            <p>Medical: <b>911</b></p>
            <p>Mental Health: <b>988</b></p>
        </div>

        <div class="card">
            <h3>🗳 Voting</h3>
            <a href="https://www.usa.gov/register-to-vote" target="_blank">Register</a><br>
            <a href="https://www.usa.gov/voting" target="_blank">How to Vote</a>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
